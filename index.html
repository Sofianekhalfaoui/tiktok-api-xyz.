<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>زيادة مشاهدات TikTok</title>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(to bottom, #2c2c2c, #1a1a1a);
      color: #fff;
      padding: 40px 20px;
      text-align: center;
      min-height: 100vh;
    }
    input, button {
      display: block;
      margin: 15px auto;
      padding: 12px;
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    input {
      background-color: #3a3a3a;
      color: #fff;
    }
    input::placeholder {
      color: #aaa;
    }
    button {
      background-color: #00c853;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background-color: #00b34f;
    }
    .response {
      margin-top: 20px;
      color: #00e676;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>زيادة مشاهدات TikTok</h2>
  <input type="text" id="videoLink" placeholder="رابط فيديو TikTok">
  <input type="number" id="viewCount" placeholder="عدد المشاهدات">
  <button onclick="sendViews()">إرسال</button>
  <div class="response" id="responseBox"></div>

  <script>
    async function sendViews() {
      const link = document.getElementById('videoLink').value;
      const count = document.getElementById('viewCount').value;
      const responseBox = document.getElementById('responseBox');

      if (!link || !count) {
        responseBox.textContent = "يرجى تعبئة جميع الحقول.";
        responseBox.style.color = "red";
        return;
      }

      try {
        const res = await fetch("https://your-project-name.onrender.com/sendViews", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ link, count })
        });

        const data = await res.json();
        responseBox.textContent = data.message;
        responseBox.style.color = data.success ? "#00e676" : "red";
      } catch (err) {
        responseBox.textContent = "حدث خطأ أثناء إرسال الطلب.";
        responseBox.style.color = "red";
      }
    }
  </script>
</body>
</html>
